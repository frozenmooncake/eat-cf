compatibility_date = "2024-11-01"

routes = [
  { pattern = "eat-cf-worker.xks3.eu.org", custom_domain = true, enabled = true, previews_enabled = false },
]

[vars]
# 通过 wrangler secret put UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN 配置，
